name: Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Ler versão
        id: version
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build da imagem
        run: |
          docker build \
            -t ${{ secrets.REGISTRY_USERNAME }}/minha-aplicacao:${{ steps.version.outputs.VERSION }} .

      - name: Publicar imagem
        run: |
          docker push \
            ${{ secrets.REGISTRY_USERNAME }}/minha-aplicacao:${{ steps.version.outputs.VERSION }}
